version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
playwright-rust-backend-cdp-navigation = { workspace = true, features = ["frame-lifecycle"] }
playwright-rust-backend-cdp-topology = { workspace = true }
