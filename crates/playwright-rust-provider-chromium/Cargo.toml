[package]
name = "playwright-rust-provider-chromium"
description = "Optional explicit-path and system Chromium process provider for Playwright Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
startup-logs = ["tokio/io-util", "tokio/rt"]

[dependencies]
playwright-rust-browser-provider = { workspace = true }
playwright-rust-cdp = { workspace = true }
playwright-rust-provider-cdp = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
