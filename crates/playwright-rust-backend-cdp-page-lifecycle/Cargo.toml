[package]
name = "playwright-rust-backend-cdp-page-lifecycle"
description = "Isolated Chromium CDP Page lifecycle adapter for Playwright Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
native-confirmation = ["dep:serde_json"]

[dependencies]
playwright-rust-backend-cdp-common = { workspace = true }
playwright-rust-cap-page-lifecycle = { workspace = true }
playwright-rust-cdp = { workspace = true }
playwright-rust-core = { workspace = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
playwright-rust-fake = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
