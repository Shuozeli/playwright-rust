[package]
name = "playwright-rust-node-addon"
description = "Node-API conversion boundary for the Playwright Rust host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[features]
default = []
cdp-handshake-headers = ["playwright-rust-node-host/cdp-handshake-headers"]
cdp-default-user-agent = ["cdp-handshake-headers", "playwright-rust-node-host/cdp-default-user-agent", "dep:playwright-rust-playwright-connect-headers"]
cdp-discovery-errors = ["playwright-rust-node-host/cdp-discovery-errors"]
cdp-ws-close-reason = ["playwright-rust-node-host/cdp-ws-close-reason"]
cdp-session = ["playwright-rust-node-host/cdp-session", "dep:serde_json", "dep:tracing", "napi_runtime/serde-json"]
browser-cdp-session = ["cdp-session", "playwright-rust-node-host/browser-cdp-session"]
browser-registry = ["dep:playwright-rust-browser-registry"]
playwright-server-connect-ws-error = ["dep:playwright-rust-transport-ws"]
playwright-server-connect-close-error = ["dep:playwright-rust-playwright-server-initialize", "dep:playwright-rust-transport-ws"]
playwright-server-connect-headers = ["dep:playwright-rust-playwright-connect-headers", "playwright-rust-playwright-connect-headers/server-ws", "dep:playwright-rust-transport-ws"]
playwright-server-connect-session = ["dep:playwright-rust-playwright-server-connect", "playwright-rust-playwright-server-connect/live", "dep:playwright-rust-playwright-server-session", "playwright-rust-playwright-server-session/supervisor", "dep:playwright-rust-playwright-server-browser-ops", "dep:playwright-rust-playwright-server-endpoint-discovery", "dep:playwright-rust-playwright-connect-headers", "playwright-rust-playwright-connect-headers/server-ws", "dep:playwright-rust-transport-ws"]
playwright-server-connect-page-events = ["playwright-server-connect-session", "playwright-rust-playwright-server-browser-ops/page-events", "dep:playwright-rust-playwright-server-page-events", "playwright-rust-node-host/url-glob", "dep:url"]
persistent-context-preflight = ["dep:playwright-rust-persistent-context-preflight"]
owned-launch = ["playwright-rust-node-host/owned-launch", "dep:tempfile"]
playwright-trace = ["owned-launch", "playwright-rust-node-host/playwright-trace", "dep:playwright-rust-trace-playwright-v8"]
bidi-startup-failure = ["playwright-trace", "dep:playwright-rust-owned-process-startup"]
retained-file-input = ["handles", "file-input", "playwright-rust-node-host/retained-file-input"]
retained-target-marking = ["retained-file-input", "playwright-rust-node-host/retained-target-marking"]
retained-target-prevalidation = ["retained-target-marking", "playwright-rust-node-host/retained-target-prevalidation"]
retained-input-instrumentation = ["retained-target-prevalidation"]
retained-call-argument-serialization = ["retained-input-instrumentation"]
retained-serialized-payload-import = ["retained-call-argument-serialization", "playwright-rust-node-host/retained-serialized-payload-import", "dep:serde_json"]
retained-serialized-payload-mutation = ["retained-serialized-payload-import", "playwright-rust-node-host/retained-serialized-payload-mutation"]
handles = ["playwright-rust-node-host/handles"]
frame-element = ["handles", "playwright-rust-node-host/frame-element"]
element-handle-dom = ["handles", "playwright-rust-node-host/element-handle-dom"]
element-handle-select-option-value = ["handles", "timeout-settings", "playwright-rust-node-host/element-handle-select-option-value"]
element-handle-wait-for-selector = ["handles", "timeout-settings", "playwright-rust-node-host/element-handle-wait-for-selector"]
element-handle-scroll-into-view = ["handles", "timeout-settings", "playwright-rust-node-host/element-handle-scroll-into-view"]
fill-navigation-commit = ["playwright-rust-node-host/fill-navigation-commit"]
select-option-navigation-commit = ["playwright-rust-node-host/select-option-navigation-commit"]
select-option-timeout-progress = ["playwright-rust-node-host/select-option-timeout-progress"]
react-selectors = ["playwright-rust-node-host/react-selectors"]
file-input = ["playwright-rust-node-host/file-input"]
concurrent-close = ["playwright-rust-node-host/concurrent-close"]
extra-headers = ["playwright-rust-node-host/extra-headers"]
drag-runtime = ["playwright-rust-node-host/drag-runtime"]
frame-navigation = ["playwright-rust-node-host/frame-navigation", "dep:playwright-rust-cap-navigation"]
frame-navigation-burst-20 = ["frame-navigation", "playwright-rust-node-host/frame-navigation-burst-20"]
history-navigation = ["playwright-rust-node-host/history-navigation"]
page-events = ["playwright-rust-node-host/page-events"]
frame-events = ["page-events", "playwright-rust-node-host/frame-events"]
frame-detach-events = ["page-events", "playwright-rust-node-host/frame-detach-events"]
page-dialogs = ["page-events", "playwright-rust-node-host/page-dialogs"]
page-routes = ["playwright-rust-node-host/page-routes"]
route-request-history = ["page-routes", "request-history", "playwright-rust-node-host/route-request-history"]
route-regexp = ["page-routes", "playwright-rust-node-host/route-regexp"]
page-unroute = ["page-routes"]
route-header-url-overrides = ["page-routes", "playwright-rust-node-host/route-redirects"]
route-fulfill-cors = ["page-routes", "playwright-rust-node-host/route-fulfill-cors"]
console-events = ["playwright-rust-node-host/console-events"]
page-bindings = ["handles", "playwright-rust-node-host/page-bindings", "dep:serde_json"]
init-scripts = ["playwright-rust-node-host/init-scripts"]
wait-for-function = ["handles", "timeout-settings", "playwright-rust-node-host/wait-for-function"]
url-glob = ["playwright-rust-node-host/url-glob"]
wait-for-url = ["url-glob", "playwright-rust-node-host/url-wait"]
wait-for-timeout = ["playwright-rust-node-host/wait-for-timeout"]
timeout-settings = ["playwright-rust-node-host/timeout-settings"]
emulate-media = ["playwright-rust-node-host/emulate-media"]
request-gc = ["playwright-rust-node-host/request-gc"]
response-body = ["frame-navigation", "playwright-rust-node-host/response-body"]
request-history = ["playwright-rust-node-host/request-history"]
response-request = ["frame-navigation", "request-history", "playwright-rust-node-host/response-request"]
request-events = ["url-glob", "playwright-rust-node-host/request-events"]
request-frame = ["playwright-rust-node-host/request-frame"]
response-events = ["url-glob", "playwright-rust-node-host/response-events"]
response-finished = ["response-events", "playwright-rust-node-host/response-finished"]
request-post-data-json = [
    "request-events",
    "dep:serde_json",
    "napi_runtime/serde-json",
    "playwright-rust-node-host/request-post-data-json",
]
api-request = [
    "dep:playwright-rust-api-request",
    "dep:playwright-rust-api-request-auth-basic",
    "dep:playwright-rust-api-request-connector-rustls",
    "dep:playwright-rust-api-request-cookie",
    "dep:playwright-rust-api-request-decompress",
    "dep:playwright-rust-api-request-transport",
]
api-request-client-certificates = [
    "api-request",
    "dep:playwright-rust-api-request-client-certificates",
]
api-request-http-proxy = [
    "api-request",
    "dep:playwright-rust-api-request-connector-http-proxy",
]
api-request-socks5-proxy = [
    "api-request",
    "dep:playwright-rust-api-request-connector-socks5",
]
api-request-proxy-bypass = [
    "api-request",
    "dep:playwright-rust-api-request-connector-proxy-bypass",
]
context-api-request = [
    "api-request",
    "device-emulation",
    "playwright-rust-node-host/context-api-request",
    "dep:async-trait",
    "dep:url",
]
context-cookies = ["playwright-rust-node-host/context-cookies"]
device-emulation = ["playwright-rust-node-host/device-emulation"]
touchscreen-input = ["device-emulation", "playwright-rust-node-host/touchscreen-input"]
context-proxy = ["playwright-rust-node-host/context-proxy"]
context-offline = ["playwright-rust-node-host/context-offline"]
bypass-csp = ["playwright-rust-node-host/bypass-csp"]
locator-bounding-box = ["playwright-rust-node-host/locator-bounding-box"]
locator-highlight = ["locator-bounding-box", "playwright-rust-node-host/locator-highlight"]
locator-screenshot = ["playwright-rust-node-host/locator-screenshot"]
locator-dom-actions = ["playwright-rust-node-host/locator-dom-actions"]
page-viewport = ["device-emulation", "playwright-rust-node-host/page-viewport"]
selector-registration = ["playwright-rust-node-host/selector-registration"]
light-selectors = ["handles", "playwright-rust-node-host/light-selectors"]
set-content = ["playwright-rust-node-host/set-content"]
large-evaluation-results = ["playwright-rust-node-host/large-evaluation-results"]
large-evaluation-inputs = ["playwright-rust-node-host/large-evaluation-inputs"]
large-route-post-data = ["page-routes", "playwright-rust-node-host/large-route-post-data"]

[dependencies]
playwright-rust-trace-playwright-v8 = { workspace = true, optional = true }
napi_runtime = { package = "napi", version = "=3.12.2", default-features = false, features = ["napi8", "tokio_rt", "dyn-symbols"] }
napi-derive = "=3.6.3"
playwright-rust-node-host = { path = "../playwright-rust-node-host" }
playwright-rust-browser-registry = { workspace = true, optional = true }
playwright-rust-transport-ws = { workspace = true, features = ["live-tokio"], optional = true }
playwright-rust-playwright-connect-headers = { workspace = true, optional = true }
playwright-rust-playwright-server-initialize = { workspace = true, optional = true }
playwright-rust-playwright-server-connect = { workspace = true, optional = true }
playwright-rust-playwright-server-session = { workspace = true, optional = true }
playwright-rust-playwright-server-page-events = { path = "../playwright-rust-playwright-server-page-events", optional = true }
playwright-rust-playwright-server-browser-ops = { workspace = true, optional = true }
playwright-rust-playwright-server-endpoint-discovery = { workspace = true, optional = true }
playwright-rust-persistent-context-preflight = { workspace = true, optional = true }
playwright-rust-owned-process-startup = { path = "../playwright-rust-owned-process-startup", optional = true }
playwright-rust-cap-navigation = { workspace = true, optional = true, features = ["frame-navigation"] }
tokio-util = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
playwright-rust-api-request = { workspace = true, optional = true }
playwright-rust-api-request-auth-basic = { workspace = true, optional = true }
playwright-rust-api-request-client-certificates = { workspace = true, optional = true }
playwright-rust-api-request-connector-rustls = { workspace = true, optional = true }
playwright-rust-api-request-connector-http-proxy = { workspace = true, optional = true }
playwright-rust-api-request-connector-socks5 = { workspace = true, optional = true }
playwright-rust-api-request-connector-proxy-bypass = { workspace = true, optional = true }
playwright-rust-api-request-cookie = { workspace = true, optional = true }
playwright-rust-api-request-decompress = { workspace = true, optional = true }
playwright-rust-api-request-transport = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
url = { workspace = true, optional = true }
tempfile = { version = "3.24", optional = true }

[build-dependencies]
napi-build = "=2.4.1"
