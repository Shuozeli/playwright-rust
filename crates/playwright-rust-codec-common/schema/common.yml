format: 1
library: playwright.rust.common
version: { major: 1, minor: 0 }
types:
  - kind: record
    id: playwright.rust.common.call_metadata
    fields:
      - name: timeout
        type: message
        target: playwright.rust.common.duration
        cardinality: optional
      - { name: cancellation_id, type: u64, cardinality: optional }

  - kind: record
    id: playwright.rust.common.duration
    fields:
      - { name: seconds, type: u64 }
      - name: nanoseconds
        type: u32
        constraints: { maximum: 999999999 }

  - kind: enum
    id: playwright.rust.common.failure_kind
    variants:
      - { tag: 0, name: timeout }
      - { tag: 1, name: cancelled }
      - { tag: 2, name: target_closed }
      - { tag: 3, name: browser_crashed }
      - { tag: 4, name: unsupported_capability }
      - { tag: 5, name: resource_exhausted }
      - { tag: 6, name: transport_closed }
      - { tag: 7, name: protocol_violation }
      - { tag: 8, name: backend }
      - { tag: 9, name: cleanup }
