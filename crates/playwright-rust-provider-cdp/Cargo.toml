[package]
name = "playwright-rust-provider-cdp"
description = "Attach-only Chromium CDP browser provider for Playwright Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
cdp-handshake-headers = ["playwright-rust-cdp/cdp-handshake-headers"]

[dependencies]
playwright-rust-browser-provider = { workspace = true }
playwright-rust-cdp = { workspace = true }
playwright-rust-core = { workspace = true }
url = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
