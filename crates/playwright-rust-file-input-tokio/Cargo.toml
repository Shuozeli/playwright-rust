[package]
name = "playwright-rust-file-input-tokio"
description = "Optional admitted blocking execution for Playwright Rust file-input preparation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
playwright-rust-core.workspace = true
playwright-rust-file-input-model.workspace = true
playwright-rust-file-input-source.workspace = true
playwright-rust-file-input-fs.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
