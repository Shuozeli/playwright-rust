format: 1
capability: playwright.rust.locator
display_name: Locator actions
version: { major: 1, minor: 4 }
root: playwright.rust.locator
imports:
  - playwright.rust.common
commands:
  - id: locator.click
    name: click
    method: 131073
    targets: [playwright.rust.browser.frame, playwright.rust.browser.page]
    command: click_command
    result: click_result
    params_type: playwright.rust.locator.click_params
    result_type: playwright.rust.locator.action_result
    error_details_type: playwright.rust.locator.error_details
  - id: locator.fill
    name: fill
    method: 131074
    targets: [playwright.rust.browser.frame, playwright.rust.browser.page]
    command: fill_command
    result: fill_result
    params_type: playwright.rust.locator.fill_params
    result_type: playwright.rust.locator.action_result
    error_details_type: playwright.rust.locator.error_details
types:
  - kind: tagged_union
    id: playwright.rust.locator
    variants:
      - tag: 1
        name: click_command
        fields:
          - { name: call_id, type: u64 }
          - { name: object_id, type: u64 }
          - { name: metadata, type: message, target: playwright.rust.common.call_metadata }
          - { name: selector, type: message, target: playwright.rust.locator.selector }
          - { name: options, type: message, target: playwright.rust.locator.click_options }
      - tag: 2
        name: click_result
        fields:
          - { name: call_id, type: u64 }
          - { name: outcome, type: message, target: playwright.rust.locator.outcome }
      - tag: 3
        name: fill_command
        fields:
          - { name: call_id, type: u64 }
          - { name: object_id, type: u64 }
          - { name: metadata, type: message, target: playwright.rust.common.call_metadata }
          - { name: selector, type: message, target: playwright.rust.locator.selector }
          - { name: value, type: utf8 }
          - { name: options, type: message, target: playwright.rust.locator.fill_options }
      - tag: 4
        name: fill_result
        fields:
          - { name: call_id, type: u64 }
          - { name: outcome, type: message, target: playwright.rust.locator.outcome }

  - kind: record
    id: playwright.rust.locator.action_result
    public_name: locator_action_result
    public_external: true
    fields: []

  - kind: record
    id: playwright.rust.locator.click_options
    fields:
      - { name: button, type: enum, target: playwright.rust.locator.mouse_button }
      - { name: click_count, type: u8, constraints: { minimum: 1 } }
      - { name: force, type: bool }
      - { name: trial, type: bool }

  - kind: record
    id: playwright.rust.locator.click_params
    public_name: click_params
    public_external: true
    fields:
      - { name: selector, type: message, target: playwright.rust.locator.selector }
      - { name: options, type: message, target: playwright.rust.locator.click_options }

  - kind: record
    id: playwright.rust.locator.error
    fields:
      - { name: kind, type: enum, target: playwright.rust.common.failure_kind }
      - { name: message, type: utf8 }
      - { name: details, type: message, target: playwright.rust.locator.error_details, cardinality: optional }

  - kind: tagged_union
    id: playwright.rust.locator.error_details
    public_name: locator_error_details
    public_external: true
    variants:
      - tag: 0
        name: invalid_selector
        fields:
          - { name: message, type: utf8 }
      - tag: 1
        name: strict_violation
        fields:
          - { name: selector, type: utf8 }
          - { name: matches, type: u32 }
      - tag: 2
        name: invalid_backend_response
        fields:
          - { name: message, type: utf8 }
      - tag: 3
        name: backend
        fields:
          - { name: message, type: utf8 }
      - tag: 4
        name: invalid_target
        fields:
          - { name: message, type: utf8 }
      - tag: 5
        name: invalid_value
        fields:
          - { name: message, type: utf8 }

  - kind: record
    id: playwright.rust.locator.fill_options
    fields:
      - { name: force, type: bool }

  - kind: record
    id: playwright.rust.locator.fill_params
    public_name: fill_params
    public_external: true
    fields:
      - { name: selector, type: message, target: playwright.rust.locator.selector }
      - { name: value, type: utf8 }
      - { name: options, type: message, target: playwright.rust.locator.fill_options }

  - kind: enum
    id: playwright.rust.locator.mouse_button
    default: left
    variants:
      - { tag: 0, name: left }
      - { tag: 1, name: right }
      - { tag: 2, name: middle }

  - kind: enum
    id: playwright.rust.locator.optional_aria_tri_state
    variants:
      - { tag: 0, name: absent }
      - { tag: 1, name: "false" }
      - { tag: 2, name: "true" }
      - { tag: 3, name: mixed }

  - kind: enum
    id: playwright.rust.locator.optional_bool
    variants:
      - { tag: 0, name: absent }
      - { tag: 1, name: "false" }
      - { tag: 2, name: "true" }

  - kind: tagged_union
    id: playwright.rust.locator.outcome
    variants:
      - { tag: 0, name: success, fields: [] }
      - tag: 1
        name: error
        fields:
          - { name: error, type: message, target: playwright.rust.locator.error }

  - kind: record
    id: playwright.rust.locator.regex_matcher
    fields:
      - { name: source, type: utf8 }
      - { name: flags, type: utf8 }

  - kind: record
    id: playwright.rust.locator.role_pattern_selector
    fields:
      - { name: role, type: utf8 }
      - { name: name, type: message, target: playwright.rust.locator.text_pattern, cardinality: optional }
      - { name: description, type: message, target: playwright.rust.locator.text_pattern, cardinality: optional }
      - { name: checked, type: enum, target: playwright.rust.locator.optional_aria_tri_state }
      - { name: disabled, type: enum, target: playwright.rust.locator.optional_bool }
      - { name: expanded, type: enum, target: playwright.rust.locator.optional_bool }
      - { name: include_hidden, type: bool }
      - { name: level, type: u32, cardinality: optional, constraints: { minimum: 1 } }
      - { name: pressed, type: enum, target: playwright.rust.locator.optional_aria_tri_state }
      - { name: selected, type: enum, target: playwright.rust.locator.optional_bool }

  - kind: record
    id: playwright.rust.locator.role_selector
    fields:
      - { name: role, type: utf8 }
      - { name: name, type: message, target: playwright.rust.locator.text_matcher, cardinality: optional }
      - { name: description, type: message, target: playwright.rust.locator.text_matcher, cardinality: optional }
      - { name: checked, type: enum, target: playwright.rust.locator.optional_aria_tri_state }
      - { name: disabled, type: enum, target: playwright.rust.locator.optional_bool }
      - { name: expanded, type: enum, target: playwright.rust.locator.optional_bool }
      - { name: include_hidden, type: bool }
      - { name: level, type: u32, cardinality: optional, constraints: { minimum: 1 } }
      - { name: pressed, type: enum, target: playwright.rust.locator.optional_aria_tri_state }
      - { name: selected, type: enum, target: playwright.rust.locator.optional_bool }

  - kind: tagged_union
    id: playwright.rust.locator.selector
    variants:
      - tag: 0
        name: css
        fields:
          - { name: value, type: utf8 }
      - tag: 1
        name: nth
        fields:
          - { name: base, type: message, target: playwright.rust.locator.selector }
          - { name: index, type: i32 }
      - tag: 2
        name: filter_text
        fields:
          - { name: base, type: message, target: playwright.rust.locator.selector }
          - { name: text, type: utf8 }
          - { name: exact, type: bool }
      - tag: 3
        name: and
        fields:
          - { name: left, type: message, target: playwright.rust.locator.selector }
          - { name: right, type: message, target: playwright.rust.locator.selector }
      - tag: 4
        name: or
        fields:
          - { name: left, type: message, target: playwright.rust.locator.selector }
          - { name: right, type: message, target: playwright.rust.locator.selector }
      - tag: 5
        name: text
        fields:
          - { name: matcher, type: message, target: playwright.rust.locator.text_matcher }
      - tag: 6
        name: label
        fields:
          - { name: matcher, type: message, target: playwright.rust.locator.text_matcher }
      - tag: 7
        name: role
        fields:
          - { name: selector, type: message, target: playwright.rust.locator.role_selector }
      - tag: 8
        name: within
        fields:
          - { name: base, type: message, target: playwright.rust.locator.selector }
          - { name: descendant, type: message, target: playwright.rust.locator.selector }
      - tag: 9
        name: filter_not_text
        fields:
          - { name: base, type: message, target: playwright.rust.locator.selector }
          - { name: text, type: utf8 }
          - { name: exact, type: bool }
      - tag: 10
        name: filter_has
        fields:
          - { name: base, type: message, target: playwright.rust.locator.selector }
          - { name: descendant, type: message, target: playwright.rust.locator.selector }
      - tag: 11
        name: filter_has_not
        fields:
          - { name: base, type: message, target: playwright.rust.locator.selector }
          - { name: descendant, type: message, target: playwright.rust.locator.selector }
      - tag: 12
        name: filter_visible
        fields:
          - { name: base, type: message, target: playwright.rust.locator.selector }
          - { name: visible, type: bool }
      - tag: 13
        name: text_regex
        fields:
          - { name: matcher, type: message, target: playwright.rust.locator.regex_matcher }
      - tag: 14
        name: label_regex
        fields:
          - { name: matcher, type: message, target: playwright.rust.locator.regex_matcher }
      - tag: 15
        name: filter_text_regex
        fields:
          - { name: base, type: message, target: playwright.rust.locator.selector }
          - { name: matcher, type: message, target: playwright.rust.locator.regex_matcher }
      - tag: 16
        name: filter_not_text_regex
        fields:
          - { name: base, type: message, target: playwright.rust.locator.selector }
          - { name: matcher, type: message, target: playwright.rust.locator.regex_matcher }
      - tag: 17
        name: role_pattern
        fields:
          - { name: selector, type: message, target: playwright.rust.locator.role_pattern_selector }

  - kind: record
    id: playwright.rust.locator.text_matcher
    fields:
      - { name: value, type: utf8 }
      - { name: exact, type: bool }

  - kind: tagged_union
    id: playwright.rust.locator.text_pattern
    variants:
      - tag: 0
        name: string
        fields:
          - { name: matcher, type: message, target: playwright.rust.locator.text_matcher }
      - tag: 1
        name: regex
        fields:
          - { name: matcher, type: message, target: playwright.rust.locator.regex_matcher }
