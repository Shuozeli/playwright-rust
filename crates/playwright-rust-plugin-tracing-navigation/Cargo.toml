playwright-rust-tracing-service = { workspace = true }

[dev-dependencies]
playwright-rust-backend-cdp = { workspace = true }
playwright-rust-browser-provider = { workspace = true }
playwright-rust-cdp = { workspace = true }
playwright-rust-provider-cdp = { workspace = true }
playwright-rust-process-metrics = { workspace = true, features = ["ledger"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
