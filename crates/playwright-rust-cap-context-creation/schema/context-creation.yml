format: 1
capability: playwright.rust.context_creation
version: { major: 1, minor: 0 }
root: playwright.rust.context_creation
imports:
  - playwright.rust.common
dependencies:
  - id: playwright.rust.context_lifecycle
    minimum_version: { major: 1, minor: 0 }
commands:
  - id: browser.new_context
    name: browser_new_context
    method: 196612
    targets: [playwright.rust.browser.browser]
    command: browser_new_context_command
    result: browser_new_context_result
    params_type: playwright.rust.context_creation.browser_new_context_options
    result_type: playwright.rust.context_creation.browser_context_initializer
    error_details_type: playwright.rust.context_creation.error_details
types:
  - kind: tagged_union
    id: playwright.rust.context_creation
    variants:
      - tag: 1
        name: browser_new_context_command
        fields:
          - { name: call_id, type: u64 }
          - { name: object_id, type: u64 }
          - { name: metadata, type: message, target: playwright.rust.common.call_metadata }
          - { name: options, type: message, target: playwright.rust.context_creation.browser_new_context_options }
      - tag: 2
        name: browser_new_context_result
        fields:
          - { name: call_id, type: u64 }
          - { name: outcome, type: message, target: playwright.rust.context_creation.outcome }

  - kind: record
    id: playwright.rust.context_creation.browser_context_initializer
    public_name: browser_context_initializer
    public_external: true
    fields:
      - { name: object_id, type: u64 }
      - { name: parent_id, type: u64 }
      - { name: object_kind, type: u32 }

  - kind: record
    id: playwright.rust.context_creation.browser_new_context_options
    public_name: browser_new_context_options
    public_external: true
    fields: []

  - kind: record
    id: playwright.rust.context_creation.error
    fields:
      - { name: failure_kind, type: enum, target: playwright.rust.common.failure_kind }
      - { name: message, type: utf8 }
      - name: details
        type: message
        target: playwright.rust.context_creation.error_details
        cardinality: optional

  - kind: tagged_union
    id: playwright.rust.context_creation.error_details
    public_name: context_creation_error_details
    variants:
      - tag: 0
        name: invalid_backend_response
        fields:
          - { name: message, type: utf8 }
      - tag: 1
        name: publication
        fields:
          - { name: message, type: utf8 }
      - tag: 2
        name: cleanup
        fields:
          - { name: primary, type: utf8 }
          - { name: cleanup, type: utf8 }
      - tag: 3
        name: backend
        fields:
          - { name: message, type: utf8 }

  - kind: tagged_union
    id: playwright.rust.context_creation.outcome
    variants:
      - tag: 0
        name: success
        fields:
          - { name: result, type: message, target: playwright.rust.context_creation.browser_context_initializer }
      - tag: 1
        name: error
        fields:
          - { name: error, type: message, target: playwright.rust.context_creation.error }
