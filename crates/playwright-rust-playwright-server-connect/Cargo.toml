[package]
name = "playwright-rust-playwright-server-connect"
description = "Opt-in browser-neutral Playwright Server connect composition"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
live = [
    "playwright-rust-playwright-server-endpoint-discovery/live-reqwest",
    "playwright-rust-playwright-server-session/live-tokio",
]

[dependencies]
playwright-rust-playwright-server-endpoint-discovery = { workspace = true }
playwright-rust-playwright-server-session = { workspace = true, features = ["supervisor"] }
playwright-rust-transport-ws = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
playwright-rust-playwright-server-client-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
