[package]
name = "playwright-rust-backend-cdp-selector-geometry"
description = "Bounded first-party Chromium selector-to-geometry plugin for Playwright Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
playwright-rust-backend-cdp-common = { workspace = true }
playwright-rust-backend-cdp-locator-screenshot = { workspace = true }
playwright-rust-backend-cdp-selector-runtime = { workspace = true }
playwright-rust-cap-locator-screenshot = { workspace = true }
playwright-rust-cdp = { workspace = true }
playwright-rust-core = { workspace = true }
playwright-rust-selector-model = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
playwright-rust-browser-provider = { workspace = true }
playwright-rust-fake = { workspace = true }
playwright-rust-provider-cdp = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
