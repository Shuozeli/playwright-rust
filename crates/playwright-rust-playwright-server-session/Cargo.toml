[package]
name = "playwright-rust-playwright-server-session"
description = "Opt-in Playwright Server session bootstrap and connection-owned browser lease"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
live-tokio = ["playwright-rust-transport-ws/live-tokio"]
supervisor = []
page-events = ["supervisor", "dep:playwright-rust-playwright-server-page-events"]
close-notices = ["supervisor", "dep:playwright-rust-playwright-server-page-events"]
frame-title = ["supervisor"]

[dependencies]
playwright-rust-playwright-server-client-core = { path = "../playwright-rust-playwright-server-client-core" }
playwright-rust-playwright-server-page-events = { path = "../playwright-rust-playwright-server-page-events", optional = true }
playwright-rust-transport-ws = { path = "../playwright-rust-transport-ws" }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
