version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
playwright-rust-core = { workspace = true }
playwright-rust-cdp = { workspace = true }
playwright-rust-input-model = { workspace = true }
